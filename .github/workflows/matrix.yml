name: Matrix Demo
on:
  push:
    branches:
      - main
jobs:
    build:
      strategy:
        matrix:
          node-version: [12, 16]
          os: [ubuntu-latest, windows-lastest]
          include:
            - node-version: 18
            - os: [ubuntu-slim]
          exclude:
            - node-version: 12
            - os: [windows-latest]
      runs-on: ${{ matrix.os }}
      steps: 
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build